name: CI/CD Pipeline - Deploy Automático a Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================
  # JOB 1: Validaciones de tests antes del deploy
  # =========================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, gd, zip
          coverage: none

      - name: Instalar dependencias Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar Tests
        run: php artisan test

  # =========================================================
  # JOB 2: Despliegue Automático por SSH en Servidor Lightsail
  # =========================================================
  deploy:
    name: Deploy to Lightsail Server
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y Desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'admin' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            echo "==> Iniciando despliegue automático en Lightsail..."
            
            # Si el proyecto aún no existe, clonarlo
            if [ ! -d "$HOME/istpet-bar" ]; then
              echo "==> Clonando repositorio por primera vez..."
              git clone https://github.com/Alexg5072/ISTPET_Bar.git $HOME/istpet-bar
            fi

            cd $HOME/istpet-bar
            
            # Descargar los últimos cambios de main
            echo "==> Actualizando código desde Git..."
            git fetch origin main
            git reset --hard origin/main

            # Crear .env si no existe todavía
            if [ ! -f ".env" ]; then
              echo "==> Creando .env inicial..."
              cat << 'EOF' > .env
            APP_NAME="ISTPET Bar"
            APP_ENV=production
            APP_KEY=base64:MqpY5xnaUzQ0V07BRBKhHVcDVOrIg8zGbRtVbCz8aRM=
            APP_DEBUG=false
            APP_URL=https://istpetbar.com
            APP_PORT=80

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=istpet_bar
            DB_USERNAME=istpet_user
            DB_PASSWORD=SecretPassword2026!
            DB_ROOT_PASSWORD=RootSecret2026!

            SESSION_DRIVER=database
            CACHE_STORE=database
            FRESH_DB=true
            RUN_MIGRATIONS=true
            RUN_SEEDERS=true
            EOF
            fi

            # Construir y levantar contenedores con la versión actualizada
            echo "==> Levantando contenedores Docker..."
            docker compose up -d --build

            # Limpiar imágenes residuales para mantener el disco limpio
            docker image prune -f

            echo "==> ¡Despliegue finalizado con éxito en https://istpetbar.com!"

      - name: Verificar disponibilidad del dominio en producción
        run: |
          echo "==> Esperando a que los servicios estén listos..."
          sleep 15
          echo "==> Verificando https://istpetbar.com/up..."
          curl -fsS --retry 5 --retry-delay 3 https://istpetbar.com/up || true
